[project]
name = "supermimic"
version = "0.1.0"
description = "SuperMimic reproduction on mjlab (MuJoCo Warp)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab==1.6.0",
    "torch>=2.7.0",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
